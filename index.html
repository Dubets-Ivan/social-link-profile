<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Link Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="profile-card">
            <img src="../social-link-profile/assets/images/avatar-jessica.jpeg" alt="Jessica Randall Profile Picture">
            <p class="profile-name">Jessica Randall</p>
            <p class="location">London, United Kingdom</p>
            <p class="bio">"Front-end developer and avid reader"</p>
            <ul class="social-links">
                <li class="social-link">
                    <a href="">GitHub</a>
                </li>
                <li class="social-link">
                    <a href="">Frontend Mentor</a>
                </li>
                <li class="social-link">
                    <a href="">LinkedIn</a>
                </li>
                <li class="social-link">
                    <a href="">Twitter</a>
                </li>
                <li class="social-link">
                    <a href="">Instagram</a>
                </li>
            </ul>
        </div>
    </main>
</body>
</html>
